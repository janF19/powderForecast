name: Fetch Weather Data

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.31.0 urllib3==2.0.7 certifi==2023.7.22 
          pip install charset-normalizer==3.3.0 idna==3.4 
          pip install openmeteo-requests>=1.1.0 requests-cache>=1.1.0 retry-requests>=2.0.0
          pip install pandas==2.1.0

      - name: Run weather fetch script
        run: |
          python getForecastFull_all_resorts.py
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "UTC"

      
      - name: Publish data to the `data` branch
        # Data zamerne NEJDOU do main. Kazdy commit do main znamenal, ze
        # Coolify prestavel celou aplikaci kvuli jednomu JSON souboru, ve
        # kterem se nezmenil ani radek kodu -- a build cache na serveru rostla
        # o ~1 GB za par dni. Aplikace si data stahuje za behu (weatherData.js).
        #
        # Vetev je orphan a force-pushuje se: drzi jediny soubor v jedinem
        # commitu, takze historie nebobtna o 7 MB kazdou noc.
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan data-tmp
          git reset
          git add -f weather_dataFull_7.json
          git commit -m "Update weather data $(date -u +%Y-%m-%d)"
          git push -f origin data-tmp:data
